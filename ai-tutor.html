<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMA-Alpha | Maintenance de Sécurité | Simple Maths Academy</title>
  <link rel="icon" type="image/png" href="assets/logo-transparent.png" />
  <meta name="description" content="MAINTENANCE DE SÉCURITÉ : SMA-Alpha est actuellement hors-ligne pour calibrage. Accès suspendu jusqu'à demain matin." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #0b1120;
      --navy-card: #1e293b;
      --blue: #2563eb;
      --cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #fb923c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background-color: var(--navy);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient radial glow background */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, rgba(6,182,212,0.06) 45%, transparent 70%);
      pointer-events: none;
    }

    .maint-card {
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(251, 146, 60, 0.35);
      border-radius: 1.75rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(251, 146, 60, 0.1) inset,
        0 0 60px rgba(251, 146, 60, 0.12),
        0 40px 100px rgba(0,0,0,0.7);
      position: relative;
      z-index: 10;
    }

    .maint-logo {
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .maint-logo img {
      height: 44px;
      object-fit: contain;
    }

    .maint-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(251, 146, 60, 0.12);
      border: 1px solid rgba(251, 146, 60, 0.3);
      border-radius: 20px;
      padding: 0.35rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--orange);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .brain-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1.25rem;
      animation: brain-pulse 2s ease-in-out infinite;
    }

    @keyframes brain-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(37,99,235,0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(6,182,212,0.6)); }
    }

    .maint-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .maint-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37,99,235,0.35);
      transition: opacity 0.2s, transform 0.2s;
    }

    .back-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="maint-card">
    <a href="/index.html" class="maint-logo" aria-label="Simple Maths Academy">
      <img src="assets/logo-transparent.png" alt="Logo Simple Maths Academy" />
    </a>

    <div>
      <div class="maint-status-badge">
        <span class="pulse-dot"></span>
        Maintenance de Sécurité
      </div>
    </div>

    <span class="brain-icon">🧠</span>

    <h1 class="maint-title">SMA-Alpha — Hors-Ligne</h1>

    <p class="maint-text">
      MAINTENANCE DE SÉCURITÉ : SMA-Alpha est actuellement hors-ligne pour calibrage. Accès suspendu jusqu'à demain matin.
    </p>

    <a href="/index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Retour à l'accueil
    </a>
  </div>
</body>

</html>
